.cur{border-color:hsl(var(--h) 85% 55%)}

.center{text-align:center}
.ans{font-weight:700;margin-top:10px}

.fb{border-radius:18px;padding:12px 16px;margin:12px 0;border:3px solid}

.fb.ok{background:#0f9d5826;border-color:var(--ok)}.fb.no{background:#e5393526;border-color:var(--no)}

.slide{animation:slide .3s}

ITEMS.forEach(i => { let c = CH.find(x => x.name === i.chapter); if (!c) CH.push(c = { name: i.chapter, items: [] }); c.items.push(i); });
CH.forEach(c => { c.q = c.items.map(mk); c.i = 0; });
const stat = c => ({ n: c.q.length, done: c.q.filter(x => x.res).length, ok: c.q.filter(x => x.res === 'ok').length });
const overall = () => CH.reduce((t, c) => { const s = stat(c); return { n: t.n + s.n, done: t.done + s.done, ok: t.ok + s.ok }; }, { n: 0, done: 0, ok: 0 });
let view = { k: 'home' }, rev = null, open = false;

/* ---- saved progress: answers, scores, position ---- */
function persist() {
  const p = { a: {}, pos: {}, last: lastCh && lastCh.name };
  CH.forEach(c => { p.pos[c.name] = c.i; c.q.forEach(x => { if (x.res) p.a[idOf(x.it)] = { p: x.pick, r: x.res, c: x.choices, j: x.j }; }); });
  jset(PKEY, p);
}
function restore() {
  const p = jget(PKEY, null); if (!p) return;
  CH.forEach(c => {
    if (p.pos && p.pos[c.name] <= c.q.length) c.i = p.pos[c.name] | 0;
    c.q.forEach(x => {
      const a = p.a && p.a[idOf(x.it)];
      if (a && x.choices.includes(a.p)) {
        x.pick = a.p; x.res = a.r; x.j = a.j | 0;
        if (Array.isArray(a.c) && a.c.length === x.choices.length && a.c.every(z => x.choices.includes(z))) x.choices = a.c;
      }
    });
  });
  const c = p.last && CH.find(x => x.name === p.last); if (c) { lastCh = c; view = { k: 'ch', c }; }
}
function resetProgress() {
  if (!confirm('Reset all saved progress and scores? (Your missed-questions list is kept.)')) return;
  CH.forEach(c => { c.q = c.items.map(mk); c.i = 0; }); lastCh = null; go({ k: 'home' });
}

function go(v) { view = v; open = false; render(); window.scrollTo(0, 0); app.classList.remove('slide'); void app.offsetWidth; app.classList.add('slide'); }
const chIdx = () => view.k === 'ch' ? CH.indexOf(view.c) : -1;
function chapterButtons() {
  return CH.map(c => { const s = stat(c); return el('button', { className: view.c === c ? 'cur' : '', onclick: () => go({ k: 'ch', c }) },
    el('span', { textContent: c.name + (s.done === s.n ? ' ✅' : '') }), el('span', { className: 'mu', textContent: s.ok + '/' + s.done + ' of ' + s.n })); });
}
const validMissed = () => ITEMS.filter(i => missed.includes(idOf(i)));
function render() {
  missed = load(); if (view.k === 'ch') lastCh = view.c; persist();
  const ci = chIdx(), o = overall();
  document.body.style.setProperty('--h', ci >= 0 ? (ci * 47) % 360 : view.k === 'review' ? 20 : 265);
  bar.replaceChildren(
    el('button', { textContent: open ? '✕' : '☰ Chapters', onclick: () => { open = !open; render(); } }),
    el('button', { textContent: '‹', 'aria-label': 'Previous chapter', disabled: ci < 1, onclick: () => go({ k: 'ch', c: CH[ci - 1] }) }),
    el('span', { className: 't', textContent: view.k === 'ch' ? view.c.name : view.k === 'review' ? 'Review missed' : view.k === 'summary' ? 'Results' : 'IQ Quiz Quest' }),
    el('button', { textContent: '›', 'aria-label': 'Next chapter', disabled: view.k === 'ch' ? ci >= CH.length - 1 : view.k !== 'home', onclick: () => go({ k: 'ch', c: CH[ci + 1] || CH[0] }) }),
    el('button', { textContent: muted ? '🔇' : '🔊', 'aria-label': 'Toggle sound', onclick: () => { muted = !muted; jset(MKEY, muted); if (!muted) sfx(true); render(); } }));
  drawer.hidden = !open;
  drawer.replaceChildren(
    el('button', { textContent: '🏠 Home', onclick: () => go({ k: 'home' }) }),
    el('button', { textContent: '🔁 Review missed (' + validMissed().length + ')', onclick: startReview }),
    el('button', { textContent: '🏆 Results', onclick: () => go({ k: 'summary' }) }),
    ...chapterButtons());
  if (view.k === 'home') return home(o);
  if (view.k === 'summary') return summary(o);
  deck(view.k === 'review' ? rev : view.c, view.k === 'review');
}
function skippedBox() {
  const tags = VISUAL_NOTES.map(n => n.tag), rest = SKIPPED.filter(s => !tags.includes(s[0]));
  return SKIPPED.length || VISUAL_NOTES.length ? el('details', {}, el('summary', { textContent: 'Skipped / excluded items (' + SKIPPED.length + ')' }),
    el('ul', {}, VISUAL_NOTES.map(n => el('li', { style: 'font-weight:600', textContent: n.note })),
      rest.map(s => el('li', { textContent: s[0] + ': ' + s[1] })))) : '';
}
function clearBtn() { return el('button', { textContent: 'Clear missed list', disabled: !missed.length, onclick: () => { if (confirm('Clear all saved missed questions?')) { missed = []; save(); render(); } } }); }
const resetBtn = () => el('button', { textContent: 'Reset progress', onclick: resetProgress });
function home(o) {
  app.replaceChildren(el('h1', { textContent: '🧠 IQ Quiz Quest' }),
    el('p', { className: 'mu', textContent: ITEMS.length + ' questions in ' + CH.length + ' chapters. Overall: ' + o.ok + '/' + o.done + ' correct so far. Progress is saved automatically.' }),
    skippedBox(),
    el('div', { className: 'row' }, el('button', { className: 'pri big', textContent: 'Review missed (' + validMissed().length + ')', disabled: !validMissed().length, onclick: startReview }), clearBtn(), resetBtn()),
    el('div', { className: 'list' }, chapterButtons()));
}
function startReview() { rev = { name: 'Review missed', q: shuffle(validMissed()).map(mk), i: 0 }; go({ k: 'review' }); }
function deck(d, isRev) {
  if (!d.q.length) return app.replaceChildren(skippedBox(), el('p', { textContent: 'No missed questions saved. 🎉' }), el('button', { textContent: 'Home', onclick: () => go({ k: 'home' }) }));
  if (d.i >= d.q.length) return done(d, isRev);
  const q = d.q[d.i], s = stat(d), o = overall();
  app.replaceChildren(skippedBox(),
    el('p', { className: 'mu', textContent: d.name + ' · Question ' + (d.i + 1) + ' of ' + d.q.length + ' · Chapter score ' + s.ok + '/' + s.done + (isRev ? '' : ' · Overall ' + o.ok + '/' + o.done) }),
    qnav(d),
    el('div', { className: 'card' }, el('p', { textContent: q.it.question })),
    el('div', {}, q.choices.map(c => el('button', { className: 'opt' + (q.res ? (c === q.it.answer ? ' good' : c === q.pick ? ' bad' : '') : ''), textContent: c, disabled: !!q.res, onclick: () => answer(d, c, isRev) }))),
    q.res ? feedback(d, q) : '',
    navRow(d));
}
function qnav(d) {
  return el('div', { className: 'qn' }, d.q.map((x, i) => el('button', { className: (i === d.i ? 'cur ' : '') + (x.res === 'ok' ? 'good' : x.res === 'no' ? 'bad' : ''), textContent: i + 1, 'aria-label': 'Go to question ' + (i + 1), onclick: () => { d.i = i; render(); window.scrollTo(0, 0); } })));
}
function navRow(d) {
  const q = d.q[d.i], last = d.i + 1 >= d.q.length;
  return el('div', { className: 'row' },
    el('button', { className: 'big', textContent: '‹ Previous', disabled: d.i < 1, onclick: () => { d.i--; render(); window.scrollTo(0, 0); } }),
    el('button', { className: 'big' + (q.res ? ' pri' : ''), textContent: last ? 'Finish 🏁' : 'Next ›', onclick: () => { d.i++; render(); window.scrollTo(0, 0); } }));
}
function feedback(d, q) {
  const ok = q.res === 'ok', J = ok ? OKJ : NOJ;
  return el('div', { className: 'fb ' + (ok ? 'ok' : 'no') + (fresh === q ? ' fresh' : '') },
    el('h2', { textContent: ok ? '✅ Correct!' : '❌ Oops!' }),
    el('p', { textContent: J[(q.j | 0) % J.length] }),
    el('p', { className: 'ans', textContent: "The book's answer: " + q.it.answer }),
    q.it.explanation ? el('p', { className: 'mu', textContent: q.it.explanation }) : '');
}
function answer(d, c, isRev) {
  const q = d.q[d.i], id = idOf(q.it), ok = c === q.it.answer; q.pick = c; q.res = ok ? 'ok' : 'no'; q.j = Math.random() * 5 | 0;
  if (ok && isRev) missed = missed.filter(m => m !== id);
  if (!ok && !missed.includes(id)) missed.push(id);
  save(); fresh = q; sfx(ok); render(); fresh = null;
}
function trophy(o) {
  const p = o.done ? Math.round(o.ok / o.done * 100) : 0, st = p >= 90 ? 3 : p >= 70 ? 2 : p >= 40 ? 1 : 0;
  const rank = p >= 90 ? '🏆 Brain Wizard' : p >= 70 ? '🚀 Puzzle Pro' : p >= 50 ? '🎯 Getting Warmer' : '🌱 Warm-up Round';
  return el('div', { className: 'card center' },
    el('div', { className: 'stars' }, [0, 1, 2].map(i => el('span', { className: 'star', style: 'animation-delay:' + i * .2 + 's', textContent: i < st ? '★' : '☆' }))),
    el('div', { className: 'score', textContent: o.ok + ' / ' + o.done }),
    el('p', { className: 'ans', textContent: rank + ' · ' + p + '%' }),
    el('p', { className: 'mu', textContent: missed.length + ' question(s) saved for review.' }));
}
function done(d, isRev) {
  const ci = CH.indexOf(d);
  app.replaceChildren(el('h1', { textContent: d.name + ' complete! 🎉' }), trophy(stat(d)), qnav(d),
    el('div', { className: 'row' },
      !isRev && ci < CH.length - 1 ? el('button', { className: 'pri big', textContent: 'Next chapter ›', onclick: () => go({ k: 'ch', c: CH[ci + 1] }) }) : '',
      el('button', { className: 'big', textContent: '🏆 Results', onclick: () => go({ k: 'summary' }) })),
    el('button', { textContent: 'Restart ' + (isRev ? 'review' : 'chapter'), onclick: () => { if (isRev) return startReview(); d.q = d.items.map(mk); d.i = 0; render(); } }));
}
function summary(o) {
  app.replaceChildren(el('h1', { textContent: '🏆 Results' }), trophy(o),
    el('p', { className: 'mu center', textContent: o.done + ' of ' + o.n + ' questions answered' }),
    el('div', { className: 'list' }, chapterButtons()),
    el('div', { className: 'row' }, el('button', { className: 'pri big', textContent: 'Review missed', disabled: !validMissed().length, onclick: startReview }), clearBtn(), resetBtn()));
}
restore(); render();
</script></body></html>
